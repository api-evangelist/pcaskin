notes: >-
  Live, provider-published UCP agent-commerce MCP endpoint. tools/list over the
  public endpoint requires a UCP agent profile URI (returns error
  invalid_profile_url / "Missing profile uri" without one), so the tool surface
  below is taken verbatim from the provider's published /llms.txt agent flow and
  the UCP shopping capabilities in /.well-known/ucp. Checkout requires
  contemporaneous human/buyer approval; the endpoint is rate-limited per IP
  (back off on 429).
tools:
- name: search_catalog
  description: Search the store catalog for products matching a buyer's intent.
  capability: dev.ucp.shopping.catalog.search
- name: create_cart
  description: Create a cart and add desired items.
  capability: dev.ucp.shopping.cart
- name: create_checkout
  description: Start the purchase/checkout flow for a cart.
  capability: dev.ucp.shopping.checkout
- name: update_checkout
  description: Set shipping address and fulfillment method on a checkout.
  capability: dev.ucp.shopping.fulfillment
- name: complete_checkout
  description: Finalize the purchase — buyer must explicitly approve payment.
  capability: dev.ucp.shopping.checkout
capabilities:
- dev.ucp.shopping.checkout
- dev.ucp.shopping.fulfillment
