aid: pcaskin
name: PCA SKIN
description: >-
  PCA SKIN is a professional skincare brand specializing in dermatologically tested
  chemical peels and result-oriented corrective products, positioned as a leading
  professional chemical-peel brand among estheticians and skincare professionals. The
  brand's direct-to-consumer store at pcaskin.com is built on Shopify and exposes a
  modern agent-commerce surface: it implements the Universal Commerce Protocol (UCP)
  with a hosted MCP endpoint plus read-only storefront JSON, so AI shopping agents can
  discover the catalog, build carts, and drive buyer-approved checkout. Surfaced as a
  portfolio company of Norwest Venture Partners and enriched by the API Evangelist
  pipeline from the store's published agent surface (/llms.txt, /.well-known/ucp).
